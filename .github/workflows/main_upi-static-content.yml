name: Validate and deploy Ultra PRO Partner Integration Portal

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: upi-static-content-production
  cancel-in-progress: false

env:
  NODE_VERSION: '24.x'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AZURE_ONBOARD_WEBAPP_NAME: ${{ vars.AZURE_ONBOARD_WEBAPP_NAME || vars.AZURE_WEBAPP_NAME || 'upi-partner-integrations-jdz-prod' }}
  AZURE_TRUST_WEBAPP_NAME: ${{ vars.AZURE_TRUST_WEBAPP_NAME || 'upi-trust-center-jdz-prod' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-upi-static-content-prod' }}
  AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westus2' }}
  EDI_SUPPORT_EMAIL: ${{ vars.EDI_SUPPORT_EMAIL || 'edisupport@ultrapro.com' }}
  SECURITY_SUPPORT_EMAIL: ${{ vars.SECURITY_SUPPORT_EMAIL || 'security@ultrapro.com' }}
  BOOKINGS_URL: ${{ vars.BOOKINGS_URL || 'https://outlook.office.com/book/Gf5423982311f4b3ab05454634c0d6b7a@ultrapro.com/s/g887hXf47UGAtzwghQraEg2?ismsaljsauthenabled' }}
  ONBOARD_HOSTNAME: ${{ vars.ONBOARD_HOSTNAME || 'onboard.ultrapro.com' }}
  TRUST_HOSTNAME: ${{ vars.TRUST_HOSTNAME || 'trust.ultrapro.com' }}
  DEPLOYMENT_ENVIRONMENT: production

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and validate the static site
        run: npm test

      - name: Create Azure deployment package
        run: |
          mkdir -p release-onboard release-trust
          cp -R dist/onboard/. release-onboard/
          cp package.json server.mjs release-onboard/
          cp -R dist/trust/. release-trust/
          cp package.json server.mjs release-trust/
          cd release-onboard
          zip -r ../onboard-release.zip .
          cd ../release-trust
          zip -r ../trust-release.zip .

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: partner-sites
          path: |
            onboard-release.zip
            trust-release.zip
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && vars.DEPLOY_AZURE == 'true'
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out infrastructure files
        uses: actions/checkout@v4

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: partner-sites

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision or reconcile Azure resources
        if: vars.PROVISION_AZURE == 'true'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/main.bicep \
              --parameters \
                appName="$AZURE_ONBOARD_WEBAPP_NAME" \
                trustAppName="$AZURE_TRUST_WEBAPP_NAME" \
                keyVaultName="$AZURE_KEY_VAULT_NAME" \
                location="$AZURE_LOCATION" \
              --only-show-errors

      - name: Verify Key Vault configuration
        if: env.AZURE_KEY_VAULT_NAME != ''
        uses: azure/cli@v2
        with:
          inlineScript: |
            az keyvault show \
              --name "$AZURE_KEY_VAULT_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query '{name:name,rbac:properties.enableRbacAuthorization}' \
              --output json

      - name: Deploy integration onboarding site
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_ONBOARD_WEBAPP_NAME }}
          slot-name: Production
          package: onboard-release.zip

      - name: Deploy Trust Center site
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_TRUST_WEBAPP_NAME }}
          slot-name: Production
          package: trust-release.zip

      - name: Configure custom domains and managed TLS
        if: vars.CONFIGURE_CUSTOM_DOMAINS == 'true'
        uses: azure/cli@v2
        with:
          inlineScript: |
            configure_domain() {
              local app_name="$1"
              local hostname="$2"
              local certificate_name="${app_name}-managed"

              if [ "$(az webapp config hostname list --resource-group "$AZURE_RESOURCE_GROUP" --webapp-name "$app_name" --query "[?name=='${hostname}'] | length(@)" --output tsv)" = "0" ]; then
                az webapp config hostname add \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --webapp-name "$app_name" \
                  --hostname "$hostname" \
                  --only-show-errors
              fi

              local thumbprint
              thumbprint="$(az webapp config ssl show --resource-group "$AZURE_RESOURCE_GROUP" --certificate-name "$certificate_name" --query thumbprint --output tsv 2>/dev/null || true)"
              if [ -z "$thumbprint" ]; then
                az webapp config ssl create \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$app_name" \
                  --hostname "$hostname" \
                  --certificate-name "$certificate_name" \
                  --output none \
                  --only-show-errors

                for attempt in $(seq 1 20); do
                  thumbprint="$(az webapp config ssl show --resource-group "$AZURE_RESOURCE_GROUP" --certificate-name "$certificate_name" --query thumbprint --output tsv 2>/dev/null || true)"
                  if [ -n "$thumbprint" ]; then
                    break
                  fi
                  sleep 15
                done
              fi

              if [ -z "$thumbprint" ]; then
                echo "Managed certificate for ${hostname} did not become ready within five minutes."
                return 1
              fi

              az webapp config ssl bind \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app_name" \
                --certificate-thumbprint "$thumbprint" \
                --ssl-type SNI \
                --only-show-errors
            }

            configure_domain "$AZURE_ONBOARD_WEBAPP_NAME" "$ONBOARD_HOSTNAME"
            configure_domain "$AZURE_TRUST_WEBAPP_NAME" "$TRUST_HOSTNAME"

      - name: Smoke test the deployed site
        run: |
          ONBOARD_SITE_URL="https://${AZURE_ONBOARD_WEBAPP_NAME}.azurewebsites.net"
          TRUST_SITE_URL="https://${AZURE_TRUST_WEBAPP_NAME}.azurewebsites.net"
          if [ "${{ vars.CONFIGURE_CUSTOM_DOMAINS }}" = "true" ]; then
            ONBOARD_SITE_URL="https://${ONBOARD_HOSTNAME}"
            TRUST_SITE_URL="https://${TRUST_HOSTNAME}"
          fi
          probe() {
            curl --fail --silent --show-error \
              --retry 30 \
              --retry-delay 10 \
              --retry-max-time 300 \
              --retry-all-errors \
              "$1" > /dev/null
          }

          probe "$ONBOARD_SITE_URL/"
          probe "$ONBOARD_SITE_URL/privacy.html"
          probe "$TRUST_SITE_URL/"
          probe "$TRUST_SITE_URL/data/trust-documents.json"

      - name: Sign out of Azure
        if: always()
        run: az logout
